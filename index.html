<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Demyan PC — Ремонт компьютеров</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #050810;
    color: #ffffff;
    line-height: 1.6;
}

a {
    text-decoration: none;
    color: inherit;
}

/* HEADER */

header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(5, 8, 16, 0.94);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid #172133;
}

.nav {
    max-width: 1150px;
    margin: auto;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 25px;
    font-weight: 800;
}

.logo span {
    color: #00aaff;
}

.nav-links a {
    margin-left: 25px;
    color: #aeb8ca;
    transition: 0.3s;
}

.nav-links a:hover {
    color: #00aaff;
}

/* HERO */

.hero {
    min-height: 720px;
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 80% 40%,
            rgba(0, 150, 255, 0.22),
            transparent 35%
        ),
        radial-gradient(
            circle at 20% 80%,
            rgba(70, 30, 255, 0.14),
            transparent 35%
        );
}

.hero-content {
    max-width: 1150px;
    width: 100%;
    margin: auto;
    padding: 80px 25px;
}

.badge {
    display: inline-block;
    padding: 10px 20px;
    border: 1px solid #008cff;
    border-radius: 40px;
    color: #42b8ff;
    background: rgba(0, 130, 255, 0.08);
    margin-bottom: 25px;
    font-size: 17px;
}

h1 {
    font-size: clamp(48px, 8vw, 88px);
    line-height: 1.02;
    max-width: 900px;
}

h1 span {
    color: #00aaff;
}

.hero-text {
    max-width: 720px;
    margin-top: 28px;
    font-size: 20px;
    color: #aeb8ca;
}

.buttons {
    margin-top: 35px;
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.btn {
    display: inline-block;
    padding: 17px 28px;
    border-radius: 15px;
    font-size: 18px;
    font-weight: bold;
    transition: 0.3s;
}

.btn-primary {
    background: #00aaff;
    color: #00101c;
}

.btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(0, 170, 255, 0.3);
}

.btn-secondary {
    border: 1px solid #273449;
    background: #101622;
}

.btn-secondary:hover {
    border-color: #00aaff;
    transform: translateY(-3px);
}

/* SECTIONS */

section {
    max-width: 1150px;
    margin: auto;
    padding: 85px 25px;
}

.section-title {
    font-size: 42px;
    margin-bottom: 15px;
}

.section-subtitle {
    color: #8793a8;
    margin-bottom: 40px;
    font-size: 18px;
}

/* ABOUT */

.about {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.card {
    background: linear-gradient(145deg, #0d1420, #090e18);
    border: 1px solid #1c293d;
    border-radius: 22px;
    padding: 28px;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-6px);
    border-color: #008cff;
}

.card-icon {
    font-size: 38px;
    margin-bottom: 15px;
}

.card h3 {
    font-size: 22px;
    margin-bottom: 10px;
}

.card p {
    color: #8995a9;
}

/* EXPERIENCE */

.experience {
    text-align: center;
    background:
        linear-gradient(
            135deg,
            #071526,
            #090b18
        );

    border-top: 1px solid #172337;
    border-bottom: 1px solid #172337;

    max-width: none;
}

.experience-inner {
    max-width: 900px;
    margin: auto;
}

.experience-number {
    font-size: 70px;
    font-weight: 900;
    color: #00aaff;
}

.experience-inner h2 {
    font-size: 32px;
    margin-bottom: 10px;
}

.experience-inner p {
    color: #9aa6b9;
    font-size: 18px;
}

/* SERVICES */

.services {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.service {
    padding: 28px;
    background: #0c121d;
    border: 1px solid #1a2638;
    border-radius: 20px;
    transition: 0.3s;
}

.service:hover {
    transform: translateY(-5px);
    border-color: #008cff;
}

.service h3 {
    font-size: 22px;
    margin-bottom: 12px;
}

.service p {
    color: #8f9bae;
}

.price {
    color: #00aaff;
    font-size: 22px;
    font-weight: bold;
    margin-top: 18px;
}

/* GALLERY */

.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.gallery img {
